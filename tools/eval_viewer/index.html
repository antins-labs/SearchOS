<header><div><strong>SearchOS <span style="font-weight:400;color:#a9bfd7">/ Trace Studio</span></strong><br><small>评测对话 · 调度轨迹 · 同题对比</small></div><div class="right"><span id="status" class="muted">等待数据</span><label class="upload" style="color:#243344">打开评测目录<input id="folder" type="file" webkitdirectory multiple hidden></label><button id="refresh">刷新</button><button id="sidebar-toggle">收起侧栏</button><button id="focus-toggle">专注阅读</button><button id="fullscreen">全屏</button></div></header>
<div id="layout-notice" role="status"></div><main><aside><div class="eyebrow">QUESTIONS / 题目</div><input id="question-search" type="search" placeholder="搜索题号、题目或实验…"><label class="experiment-label" for="experiment">实验目录</label><select id="experiment"><option value="">全部实验</option></select><div id="questions"></div></aside><section class="workspace"><div class="top"><div class="eyebrow">COMPARE / 同题多次运行</div><h2 id="title">选择题目，检查执行过程</h2><div id="question-text" class="question-text"></div><details id="picker"><summary style="cursor:pointer;margin-top:12px">选择对比 case <span id="selected-count" class="muted"></span></summary><div id="case-picker"></div></details><div class="toolbar"><input id="message-search" type="search" placeholder="筛选当前视图消息 / 工具 / 内容…" style="flex:1"><select id="role"><option value="">全部角色</option><option>assistant</option><option>user</option><option>tool_call</option><option>tool_result</option><option>system</option></select><label><input id="sync" type="checkbox">同步滚动</label><button id="expand">展开本页</button><button id="collapse">折叠本页</button><button id="export">导出选中 case</button></div></div><div id="columns"><div class="empty">正在读取评测索引…<br>也可以直接打开此 HTML，选择 eval_results 文件夹。</div></div></section></main>
<script>
'use strict';
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initialExperiment=new URLSearchParams(location.search).get('experiment')||'';
let cases=[],groups=[],current=null,selected=new Set(),files=null,states=new Map(),generation=0;
const stringify=v=>typeof v==='string'?v:JSON.stringify(v,null,2);
function unpack(v){if(typeof v==='string'&&/^[\[{]/.test(v.trim())){try{return unpack(JSON.parse(v))}catch{}}if(Array.isArray(v))return v.map(unpack);if(v&&typeof v==='object')return Object.fromEntries(Object.entries(v).map(([k,x])=>[k,unpack(x)]));return v}
async function read(path){if(files){if(!files.has(path))throw Error('文件不存在：'+path);return files.get(path).text()}const r=await fetch('/api/file?path='+encodeURIComponent(path));if(!r.ok)throw Error('读取失败 '+r.status+'：'+path);return r.text()}
function inline(s){return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')}
function format(v){v=unpack(v);if(typeof v!=='string')return '<pre>'+esc(JSON.stringify(v,null,2))+'</pre>';const chunks=v.split(/```[^\n]*\n([\s\S]*?)```/g);return chunks.map((part,i)=>{if(i%2)return '<pre>'+esc(part)+'</pre>';const lines=part.split('\n');let out='',table=false;for(let j=0;j<lines.length;j++){const l=lines[j];if(l.trim().startsWith('|')){if(!table){out+='<table>';table=true}if(/^\s*\|[\s:|\-]+\|\s*$/.test(l))continue;out+='<tr>'+l.trim().replace(/^\||\|$/g,'').split('|').map(c=>'<td>'+inline(c.trim())+'</td>').join('')+'</tr>';continue}if(table){out+='</table>';table=false}if(/^#{1,6} /.test(l))out+='<h3>'+inline(l.replace(/^#+ /,''))+'</h3>';else if(l.startsWith('> '))out+='<blockquote>'+inline(l.slice(2))+'</blockquote>';else out+=inline(l)+'<br>'}return out+(table?'</table>':'')}).join('')}
function setup(){const previous=$('#experiment').value||initialExperiment;const paths=new Set();for(const c of cases){const parts=c.path.split('/');paths.add(parts[0]);if(parts[0]==='ablation'){paths.add(parts.slice(0,2).join('/'));paths.add(parts.slice(0,3).join('/'))}}$('#experiment').innerHTML='<option value="">全部实验</option>'+[...paths].sort().map(p=>`<option value="${esc(p)}">${esc(p)}</option>`).join('');$('#experiment').value=paths.has(previous)?previous:'';groups=[];const map=new Map();for(const c of cases){const key=c.benchmark+'::'+c.id+'::'+c.question.trim().replace(/\s+/g,' ');if(!map.has(key)){const g={key,id:c.id,benchmark:c.benchmark,question:c.question,cases:[]};map.set(key,g);groups.push(g)}map.get(key).cases.push(c)}groups.sort((a,b)=>a.id.localeCompare(b.id,undefined,{numeric:true}));$('#status').textContent=`${groups.length} 题 / ${cases.length} cases`;renderQuestions();if(groups.length)choose(groups.find(g=>g.cases.some(matchesExperiment))||groups[0]);else $('#columns').innerHTML='<div class="empty">没有找到 eval_result.json。</div>'}
function matchesExperiment(c){const p=$('#experiment').value;return !p||c.path===p||c.path.startsWith(p+'/')}
function renderQuestions(){const q=$('#question-search').value.toLowerCase();$('#questions').innerHTML='';for(const g of groups.filter(g=>g.cases.some(matchesExperiment)).filter(g=>[g.id,g.question,...g.cases.map(c=>c.path)].join(' ').toLowerCase().includes(q))){const b=document.createElement('button');b.className='question'+(current===g?' active':'');b.innerHTML=`<span class="count">${g.cases.length}</span><b>${esc(g.id)}</b><small>${esc(g.question.slice(0,95)||'无题目正文')}</small>`;b.onclick=()=>choose(g);$('#questions').append(b)}}
function choose(g){current=g;selected=new Set(g.cases.filter(c=>c.agents.length&&matchesExperiment(c)).slice(0,2).map(c=>c.path));if(!selected.size)selected.add((g.cases.find(matchesExperiment)||g.cases[0]).path);$('#title').textContent=`${g.id} · ${g.benchmark}`;$('#question-text').textContent=g.question;$('#picker').open=!!$('#experiment').value;renderQuestions();renderPicker();renderColumns()}
function renderPicker(){$('#selected-count').textContent=`${selected.size} / ${current.cases.length}`;$('#case-picker').innerHTML='';for(const c of [...current.cases].sort((a,b)=>Number(matchesExperiment(b))-Number(matchesExperiment(a)))){const l=document.createElement('label');l.className='case-choice';const cb=document.createElement('input');cb.type='checkbox';cb.checked=selected.has(c.path);cb.onchange=()=>{cb.checked?selected.add(c.path):selected.delete(c.path);$('#selected-count').textContent=`${selected.size} / ${current.cases.length}`;renderColumns()};l.append(cb,document.createTextNode(c.path+` · ${c.status||'已出评测结果'} · ${c.agents.length} agents`+(c.agents.length?'':' · 无完整对话')));$('#case-picker').append(l)}}
function metric(label,v,percent=false){return `<div class="metric">${label}<strong>${v==null?'—':esc(percent?(v*100).toFixed(1)+'%':typeof v==='number'?v.toLocaleString(undefined,{maximumFractionDigits:1}):v)}</strong></div>`}
async function renderColumns(){const gen=++generation;$('#columns').innerHTML='';if(!selected.size){$('#columns').innerHTML='<div class="empty">从“选择对比 case”中勾选运行。</div>';return}for(const c of current.cases.filter(c=>selected.has(c.path))){const s=states.get(c.path)||{agent:'orchestrator',view:'conversation',page:0,rows:[]};states.set(c.path,s);s.case=c;const col=document.createElement('article');col.className='column';col.innerHTML=`<div class="column-head"><div class="case-title"><b>${esc(c.path.split('/').filter(p=>/202[0-9]/.test(p)).pop()||c.path.split('/').slice(0,-1).join('/'))}</b><button class="enlarge">放大此列</button></div><span class="muted">${esc(c.status||'已出评测结果')}</span><div class="case-path">${esc(c.path)}</div><div class="metrics">${metric('Item F1',c.metrics?.f1_by_item,true)}${metric('Row F1',c.metrics?.f1_by_row,true)}${metric('Score',c.metrics?.score)}${metric('耗时 / 秒',c.elapsed_s)}${metric('Tokens',c.tokens)}</div><div class="controls"><select class="view"><option value="conversation">完整对话</option><option value="trajectory">调度与执行轨迹</option><option value="answer">最终答案</option><option value="metrics">评测详情</option></select><select class="agent"></select><button class="raw">下载当前记录</button></div><div class="info muted" style="margin-top:8px"></div></div><div class="feed">加载中…</div>`;$('#columns').append(col);s.col=col;col.querySelector('.enlarge').onclick=e=>{const expand=!col.classList.contains('zoomed');document.querySelectorAll('.column').forEach(n=>{n.classList.remove('zoomed');n.querySelector('.enlarge').textContent='放大此列'});col.classList.toggle('zoomed',expand);e.target.textContent=expand?'恢复对比':'放大此列'};const agent=col.querySelector('.agent');agent.innerHTML='<option value="*">全部 agent · 按时间排序</option>'+c.agents.map(a=>`<option value="${esc(a)}">${esc(a)}</option>`).join('');if(!c.agents.includes(s.agent)&&s.agent!=='*')s.agent=c.agents[0]||'*';agent.value=s.agent;agent.disabled=['answer','metrics'].includes(s.view);col.querySelector('.view').value=s.view;const reload=async()=>{const ticket=s.ticket=(s.ticket||0)+1;s.page=0;col.querySelector('.feed').textContent='加载中…';try{const pending={agent:s.agent,view:s.view};await load(c,pending);if(gen===generation&&ticket===s.ticket){s.rows=pending.rows;renderFeed(s);col.querySelector('.info').textContent=`${s.rows.length} 条记录 · ${c.agents.length} 个 agent`}}catch(e){if(gen===generation)col.querySelector('.feed').innerHTML='<div class="error">'+esc(e.message)+'</div>'}};agent.onchange=()=>{s.agent=agent.value;reload()};col.querySelector('.view').onchange=e=>{s.view=e.target.value;agent.disabled=['answer','metrics'].includes(s.view);reload()};col.querySelector('.raw').onclick=()=>download(c.id+'-'+s.view+'.json',JSON.stringify(s.rows,null,2));col.querySelector('.feed').onscroll=e=>syncScroll(e.target);reload()}}
async function load(c,s){const base=c.path+'/';let rows=[];if(s.view==='conversation'){const names=s.agent==='*'?c.agents:[s.agent];for(const a of names){if(!c.agents.includes(a))continue;const d=JSON.parse(await read(base+'session/conversations/'+a+'.json'));rows.push({role:'system',agent_name:a,content:d.system_prompt,task:d.task,parent_agent:d.parent,children:d.children});rows.push(...(d.messages||[]).map(m=>({...m,agent_name:m.agent_name||a}))) }if(s.agent==='*')rows.sort((a,b)=>(a.timestamp||'').localeCompare(b.timestamp||''));}
else if(s.view==='trajectory'){if(!c.trajectory)throw Error('此 case 未保存 trajectory.jsonl');const lines=(await read(base+'session/trajectory.jsonl')).split('\n');rows=lines.flatMap((l,i)=>{if(!l.trim())return [];try{const e=JSON.parse(l);return [{...e,role:e.type,agent_name:e.agent||(e.type==='orchestrator_tool'?'orchestrator':'runtime'),content:e}]}catch{return [{role:'parse_error',agent_name:'runtime',content:`第 ${i+1} 行不是有效 JSON：\n${l}`}]}});if(s.agent!=='*')rows=rows.filter(m=>m.agent_name===s.agent||m.agent_name==='runtime')}
else if(s.view==='answer'){for(const name of c.answers)rows.push({role:name,content:await read(base+name)});}
else rows=c.status&&c.status!=='已出评测结果'?[{role:'status',content:'尚无可用评测结果。可查看已保存的完整对话与执行轨迹；刷新索引检查最新状态。'}]:[{role:'eval_result',content:JSON.parse(await read(base+'eval_result.json'))}];s.rows=rows}
function renderFeed(s){const feed=s.col.querySelector('.feed'),q=$('#message-search').value.toLowerCase(),role=$('#role').value;const rows=s.rows.map((m,i)=>({m,i})).filter(({m})=>(!role||m.role===role)&&(!q||JSON.stringify(m).toLowerCase().includes(q)));const pages=Math.max(1,Math.ceil(rows.length/50));s.page=Math.min(s.page,pages-1);feed.innerHTML='';const pager=()=>{const p=document.createElement('div');p.className='pager';p.innerHTML=`<button ${s.page===0?'disabled':''}>← 上页</button><span class="muted">${rows.length} 条 · ${s.page+1} / ${pages}</span><button ${s.page===pages-1?'disabled':''}>下页 →</button>`;p.children[0].onclick=()=>{s.page--;renderFeed(s);feed.scrollTop=0};p.children[2].onclick=()=>{s.page++;renderFeed(s);feed.scrollTop=0};return p};feed.append(pager());for(const {m,i} of rows.slice(s.page*50,(s.page+1)*50)){const d=document.createElement('details');d.className='message '+(m.role||'');d.open=['assistant','user'].includes(m.role)&&stringify(m.content||'').length<1800;d.innerHTML=`<summary><span class="badge">${esc(m.role)}</span><b>${esc(m.tool_name||m.agent_name||'记录')}</b> <span class="meta">#${i+1} ${esc(m.timestamp||'')}</span><span class="preview">${esc(stringify(m.content||m.reasoning||'（空消息）').slice(0,160))}</span></summary>`;let built=false;const build=()=>{if(built||!d.open)return;built=true;const b=document.createElement('div');b.className='body';if(m.task)b.innerHTML+='<b>任务</b>'+format(m.task);if(m.parent_agent)b.innerHTML+='<div class="muted">上级：'+esc(m.parent_agent)+'</div>';if(m.reasoning)b.innerHTML+='<details open><summary>Reasoning</summary>'+format(m.reasoning)+'</details>';b.innerHTML+=format(m.content??'');if(m.tool_call_id){const match=s.rows.findIndex((x,n)=>n!==i&&x.tool_call_id===m.tool_call_id);const p=document.createElement('p');p.className='meta';p.textContent='call_id: '+m.tool_call_id+(match>=0?' · 配对记录 #'+(match+1):' · 无配对记录');b.append(p)}const refs=new Set(m.children||[]);const txt=JSON.stringify(m.content);for(const a of s.case?.agents||[]){if(a!=='orchestrator'&&txt.includes('"'+a+'"'))refs.add(a)}for(const a of refs){const btn=document.createElement('button');btn.className='nav-agent';btn.textContent='↗ '+a;btn.onclick=()=>{s.col.querySelector('.view').value='conversation';s.view='conversation';const select=s.col.querySelector('.agent');select.disabled=false;select.value=a;select.dispatchEvent(new Event('change'))};b.append(btn)}const raw=document.createElement('details');raw.innerHTML='<summary>原始记录</summary><pre>'+esc(JSON.stringify(m,null,2))+'</pre>';b.append(raw);d.append(b)};d.addEventListener('toggle',build);build();feed.append(d)}if(!rows.length)feed.innerHTML+='<div class="empty">无匹配消息；可切换 agent、视图或清除筛选。</div>';feed.append(pager())}
let syncing=false;function syncScroll(source){if(!$('#sync').checked||syncing)return;syncing=true;const fraction=source.scrollTop/Math.max(1,source.scrollHeight-source.clientHeight);document.querySelectorAll('.feed').forEach(f=>{if(f!==source)f.scrollTop=fraction*(f.scrollHeight-f.clientHeight)});requestAnimationFrame(()=>syncing=false)}
function download(name,data){const url=URL.createObjectURL(new Blob([data],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('#sidebar-toggle').onclick=()=>{document.body.classList.toggle('hide-sidebar');$('#sidebar-toggle').textContent=document.body.classList.contains('hide-sidebar')?'显示侧栏':'收起侧栏'};
$('#focus-toggle').onclick=()=>{document.body.classList.toggle('focus');$('#focus-toggle').textContent=document.body.classList.contains('focus')?'退出专注':'专注阅读'};
$('#fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else throw Error('不支持全屏');$('#layout-notice').textContent=''}catch{$('#layout-notice').textContent='当前嵌入浏览器不支持全屏。可复制地址到独立浏览器窗口；专注阅读仍可扩大消息区域。';document.body.classList.add('focus');$('#focus-toggle').textContent='退出专注'}};
document.addEventListener('fullscreenchange',()=>$('#fullscreen').textContent=document.fullscreenElement?'退出全屏':'全屏');
$('#experiment').onchange=()=>{renderQuestions();const g=groups.find(g=>g.cases.some(matchesExperiment));if(g)choose(g);const url=new URL(location.href);url.searchParams.set('experiment',$('#experiment').value);history.replaceState(null,'',url)};
$('#question-search').oninput=renderQuestions;let timer;$('#message-search').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>{for(const p of selected){const s=states.get(p);s.page=0;renderFeed(s)}},200)};$('#role').onchange=()=>{for(const p of selected){const s=states.get(p);s.page=0;renderFeed(s)}};$('#expand').onclick=()=>document.querySelectorAll('.message').forEach(d=>d.open=true);$('#collapse').onclick=()=>document.querySelectorAll('.message').forEach(d=>d.open=false);
$('#export').onclick=async()=>{try{const output=[];for(const c of current?.cases.filter(c=>selected.has(c.path))||[]){const s={agent:'*',view:'conversation'};await load(c,s);output.push({case:c,messages:s.rows})}download('eval-comparison.json',JSON.stringify(output,null,2))}catch(e){alert(e.message)}};
async function serverIndex(){try{const r=await fetch('/api/index');if(!r.ok)throw Error('索引读取失败');cases=await r.json();setup()}catch(e){$('#status').textContent='离线模式';$('#columns').innerHTML='<div class="empty">选择 eval_results 目录开始检查。<br>或运行 python3 tools/eval_viewer/serve.py 后访问本地地址。</div>'}}
$('#folder').onchange=async e=>{files=new Map();states.clear();for(const f of e.target.files){const parts=f.webkitRelativePath.split('/');parts.shift();files.set(parts.join('/'),f)}cases=[];for(const [p,f] of files){if(!p.endsWith('eval_result.json'))continue;try{const d=JSON.parse(await f.text()),base=p.slice(0,-'eval_result.json'.length),prefix=base+'session/conversations/';cases.push({path:base.replace(/\/$/,''),id:String(d.id??base.split('/').filter(Boolean).pop()),benchmark:d.benchmark||'',question:d.question||'',agents:[...files.keys()].filter(k=>k.startsWith(prefix)&&k.endsWith('.json')).map(k=>k.slice(prefix.length,-5)),trajectory:files.has(base+'session/trajectory.jsonl'),answers:['raw_answer.md','reformatted.md'].filter(n=>files.has(base+n)),metrics:d.metrics||{},elapsed_s:d.elapsed_s,tokens:d.token_usage?.total_tokens})}catch{}}setup()};$('#refresh').onclick=()=>{if(files)setup();else serverIndex()};serverIndex();
</script></body></html>
