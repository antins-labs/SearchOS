                <section class="art-object-page-content-section">



  <div class="markdown">
    <p>Van Gogh presented himself in this self-portrait as a painter, holding a palette and paintbrushes behind his easel. He showed that he was a <em>modern</em> artist by using a new painting style, with bright, almost unblended colours. The palette contains the complementary colour pairs red/green, yellow/purple and blue/orange – precisely the colours Van Gogh used for this painting. He laid these pairs down side by side to intensify one another: the blue of his smock, for instance, and the orange-red of his beard.<br><br><em>Self-Portrait as a Painter</em> was the last work Van Gogh produced in Paris; the city had exhausted him both mentally and physically. <a href="http://www.vangoghletters.org/vg/letters/let626/letter.html">He told his sister Wil</a> how he had portrayed himself: ‘wrinkles in forehead and around the mouth, stiffly wooden, a very red beard, quite unkempt and sad’.</p>
