  <div class="markdown">
    <p>When he had no access to models, Van Gogh regularly painted himself. During the summer of 1887, he actually produced a whole series of self-portraits. The formal jacket he wears in this painting is an exception. In most of them he is wearing his <a href="https://www.vangoghmuseum.nl/en/collection/s0135V1962v">artist’s smock</a>.<br><br>This is one of Van Gogh’s ‘double-sided’ paintings. To save money, he has painted this self-portrait on the back of another painting. He was broke. Research has revealed that he was using a cheap paintbrush that was losing its hairs: they are still embedded in the paint.</p>
